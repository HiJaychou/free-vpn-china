<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<style>
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#1c2230;--soft:#4a5468;--muted:#7a8496;
  --line:#e3e7ee;--accent:#2f5bd3;--accent-ink:#1e3f9a;--accent-bg:#eef2fd;
  --gold:#b7791f;--gold-bg:#fdf6e7;--shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151c;--paper:#191d26;--ink:#e6e9ef;--soft:#b8bfcc;--muted:#8a93a3;
  --line:#2a303c;--accent:#7c9cf5;--accent-ink:#a9bdfa;--accent-bg:#1e2740;
  --gold:#e0a84a;--gold-bg:#2a2416;--shadow:none;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;letter-spacing:.01em}
a{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent)}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:1px}
.bar nav{display:flex;gap:16px;font-size:14px;flex-shrink:0}
.bar nav a{color:var(--soft);text-decoration:none}
.bar nav a:hover{color:var(--accent)}
.wrap{max-width:820px;margin:28px auto 0;padding:0 20px}
article{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:44px 52px 36px}
article>h1:first-child{font-size:30px;line-height:1.4;margin:0 0 18px;letter-spacing:0;font-weight:800}
article>h1:first-child+blockquote{background:var(--accent-bg);border:0;border-radius:12px;color:var(--soft);font-size:14.5px;padding:14px 18px;margin:0 0 26px}
article>h1:first-child+blockquote strong{color:var(--accent-ink)}
h1,h2,h3,h4{line-height:1.45;color:var(--ink)}
h2{font-size:23px;margin:52px 0 16px;padding-top:28px;border-top:1px solid var(--line);font-weight:750}
h2::before{content:"";display:inline-block;width:4px;height:20px;border-radius:2px;background:var(--accent);margin-right:12px;vertical-align:-3px}
h3{font-size:19px;margin:32px 0 10px;font-weight:700}
p{margin:12px 0}
ul,ol{padding-left:1.4em;margin:10px 0}
li{margin:6px 0}
li::marker{color:var(--muted)}
strong{font-weight:700;color:var(--ink)}
hr{border:0;border-top:1px dashed var(--line);margin:36px 0}
hr+h2{border-top:0;padding-top:0;margin-top:0}
blockquote{margin:18px 0;padding:10px 18px;border-left:3px solid var(--gold);background:var(--gold-bg);border-radius:0 10px 10px 0;color:var(--soft)}
blockquote p{margin:6px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--accent-bg);padding:1px 6px;border-radius:5px}
.tw{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:4.6em}
th{white-space:nowrap}
table.wide th,table.wide td{white-space:nowrap;min-width:0;font-size:14px;padding:10px 12px}
table.wide td:last-child{white-space:nowrap}
thead th{background:var(--accent-bg);color:var(--accent-ink);font-weight:700;font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-bg) 55%,transparent)}
table.rank tbody tr:first-child td{background:var(--gold-bg);font-weight:600}
table.wrapcells td,table.wrapcells th{min-width:110px}
.hint{margin:-10px 0 16px;font-size:12.5px;color:var(--muted);text-align:right}
details{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--paper);overflow:hidden}
details>summary{cursor:pointer;list-style:none;padding:13px 44px 13px 18px;position:relative;font-size:15.5px;color:var(--soft)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details[open]>summary{border-bottom:1px solid var(--line);background:var(--accent-bg)}
details>*:not(summary){margin-left:18px;margin-right:18px}
details>*:last-child{margin-bottom:16px}
.card-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 20px 12px;margin:22px 0}
.card-box>p:first-child{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.card-box>p:first-child strong{color:var(--muted);font-weight:600}
.card-box ul{list-style:none;padding:0;margin:0}
.card-box li{margin:0;padding:5px 0;border-bottom:1px dashed var(--line);font-size:15px}
.card-box li:last-child{border-bottom:0}
.card-box li a{text-decoration:none}
.card-box.toc ul{columns:2;column-gap:28px}
.card-box.toc li{break-inside:avoid;counter-increment:toc}
.card-box.toc ul{counter-reset:toc}
.card-box.toc li::before{content:counter(toc,decimal-leading-zero);color:var(--muted);font-size:12px;margin-right:10px;font-variant-numeric:tabular-nums}
.back{display:inline-block;margin:0 0 18px;font-size:14px;color:var(--muted);text-decoration:none}
footer{max-width:820px;margin:0 auto;padding:28px 20px 56px;color:var(--muted);font-size:13.5px;text-align:center}
footer a{color:var(--muted)}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{margin-top:14px;padding:0 10px}
  article{padding:26px 18px 22px;border-radius:12px}
  article>h1:first-child{font-size:24px}
  h2{font-size:20px;margin-top:40px;padding-top:22px}
  h3{font-size:17.5px}
  .bar .in{padding:10px 16px}
  .bar nav a.gh{display:none}
  .card-box.toc ul{columns:1}
  table{font-size:14px}
}
</style>
</head>
<body>
<header class="bar"><div class="in">
<a class="brand" href="{{ '/' | relative_url }}"><span></span>{{ site.title }}</a>
<nav><a href="{{ '/' | relative_url }}">首页</a><a class="gh" href="{{ site.github.repository_url }}">GitHub ⭐</a></nav>
</div></header>
<main class="wrap">
<article id="content">
{% unless page.url == '/' %}<a class="back" href="{{ '/' | relative_url }}">← 返回指南首页</a>{% endunless %}
{{ content }}
</article>
</main>
<footer>
<p>本站内容同步自 GitHub 仓库 <a href="{{ site.github.repository_url }}">{{ site.github.repository_nwo }}</a>，长期更新，欢迎 Star 收藏或提 Issue 交流。</p>
</footer>
<script>
(function(){
  var art=document.getElementById('content');
  // GitHub 风格的标题锚点，保证目录链接可用
  var used={};
  art.querySelectorAll('h1,h2,h3,h4').forEach(function(h){
    var s=h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,'').replace(/\s/g,'-');
    var id=s,n=1;while(used[id]){id=s+'-'+n++}used[id]=1;h.id=id;
  });
  // 目录、延伸阅读做成卡片
  art.querySelectorAll('p').forEach(function(p){
    var t=p.textContent.trim(),ul=p.nextElementSibling;
    if(!ul||ul.tagName!=='UL')return;
    if(t==='目录'||/^延伸阅读/.test(t)){
      var box=document.createElement('div');box.className='card-box'+(t==='目录'?' toc':'');
      p.parentNode.insertBefore(box,p);box.appendChild(p);box.appendChild(ul);
    }
  });
  // 表格包一层，手机上可以横向滑动
  art.querySelectorAll('table').forEach(function(t,i){
    var w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t);
    var head=t.querySelector('thead th');
    if(head&&/排名/.test(head.textContent))t.classList.add('rank');
    var cols=t.querySelectorAll('thead th').length;
    if(cols<=3)t.classList.add('wrapcells');
    if(cols>=5){t.classList.add('wide');var h=document.createElement('p');h.className='hint';h.textContent='← 表格可左右滑动 →';w.parentNode.insertBefore(h,w.nextSibling);}
  });
  // 站外链接新窗口打开
  art.querySelectorAll('a[href^="http"]').forEach(function(a){
    if(a.hostname!==location.hostname){a.target='_blank';a.rel=(a.rel?a.rel+' ':'')+'noopener'}
  });
})();
</script>
</body>
</html>
